name: Build Fullscreen Double-Tap Pause

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/custom-build.yaml
      - app/phone/src/main/java/dev/jdtech/jellyfin/utils/PlayerGestureHelper.kt
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: custom-findroid-build
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream main
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge upstream changes
        id: sync
        shell: bash
        run: |
          git remote add upstream https://github.com/jarnedemeulemeester/findroid.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit upstream/main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build signed release APKs
    needs: sync
    if: github.event_name != 'schedule' || needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_PATH: ${{ runner.temp }}/findroid-release.jks
    steps:
      - name: Checkout synchronized fork
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FINDROID_CUSTOM_KEYSTORE }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

      - name: Build signed phone release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.FINDROID_CUSTOM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FINDROID_CUSTOM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FINDROID_CUSTOM_KEY_PASSWORD }}
        run: |
          ./gradlew :app:phone:assembleLibreRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Verify APK signatures
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          for apk in app/phone/build/outputs/apk/libre/release/phone-libre-*-release.apk; do
            "$APKSIGNER" verify --verbose --print-certs "$apk"
          done

      - name: Upload phone APKs
        uses: actions/upload-artifact@v7
        with:
          name: findroid-fullscreen-double-tap-pause-release-${{ github.run_number }}
          path: app/phone/build/outputs/apk/libre/release/phone-libre-*-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Remove signing key
        if: always()
        run: rm -f "$KEYSTORE_PATH"
