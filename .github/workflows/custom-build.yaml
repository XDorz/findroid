name: Build Fullscreen Double-Tap Pause

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: custom-findroid-build
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream main
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge upstream changes
        id: sync
        shell: bash
        run: |
          git remote add upstream https://github.com/jarnedemeulemeester/findroid.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit upstream/main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build installable debug APKs
    needs: sync
    if: github.event_name == 'workflow_dispatch' || needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout synchronized fork
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build phone debug APKs
        run: ./gradlew :app:phone:assembleLibreDebug

      - name: Upload phone APKs
        uses: actions/upload-artifact@v7
        with:
          name: findroid-fullscreen-double-tap-pause-debug-${{ github.run_number }}
          path: app/phone/build/outputs/apk/libre/debug/phone-libre-*-debug.apk
          if-no-files-found: error
          retention-days: 30
